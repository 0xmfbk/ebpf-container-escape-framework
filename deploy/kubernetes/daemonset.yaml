apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-edr
  namespace: ebpf-edr
  labels:
    app: ebpf-edr
spec:
  selector:
    matchLabels:
      app: ebpf-edr
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ebpf-edr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      hostPID: true           # REQUIRED: to resolve container IDs and process lineage
      hostNetwork: false      # tracepoints capture host network events
      priorityClassName: system-node-critical
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: edr
          image: 0xmfbk/ebpf-container-escape-framework:v3.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # Least privilege: load/attach needs BPF+PERFMON (kernel >= 5.8)
            # plus SYS_ADMIN for kprobe attach / bpffs on older kernels.
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_ADMIN"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ebpf-edr
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf/vmlinux
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: run
              mountPath: /var/run/ebpf-edr
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /var/run/ebpf-edr/heartbeat) )) -lt 180
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /var/run/ebpf-edr/heartbeat
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: ebpf-edr-config
        - name: btf
          hostPath:
            path: /sys/kernel/btf/vmlinux
            type: File
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: run
          emptyDir: {}
      tolerations:
        - operator: Exists   # Run on master/control-plane nodes too
