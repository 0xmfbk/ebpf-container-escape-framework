apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-edr
  namespace: ebpf-edr
  labels:
    app: ebpf-edr
spec:
  selector:
    matchLabels:
      app: ebpf-edr
  template:
    metadata:
      labels:
        app: ebpf-edr
    spec:
      hostPID: true           # REQUIRED: to resolve container IDs and process lineage
      hostNetwork: false      # Not needed; tracepoints capture host network events
      containers:
        - name: edr
          image: 0xmfbk/ebpf-container-escape-framework:v2.7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/ebpf-edr
            - name: btf
              mountPath: /sys/kernel/btf/vmlinux
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: config
          configMap:
            name: ebpf-edr-config
        - name: btf
          hostPath:
            path: /sys/kernel/btf/vmlinux
            type: File
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
      tolerations:
        - operator: Exists   # Run on master/control-plane nodes too
