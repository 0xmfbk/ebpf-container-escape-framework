apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-edr-config
  namespace: ebpf-edr
data:
  config.toml: |
    mode = "audit"
    disabled_actions = ["Perf_Event_Open", "Executable_Memory"]
    [log]
    level = "info"
    [output]
    format = "json"
    target = "stdout"    [metrics]
    enabled = true
    bind = "0.0.0.0:9400"
    [sensor]
    heartbeat_event = true
