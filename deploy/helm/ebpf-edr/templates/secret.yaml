{{- if and .Values.secret.create .Values.secret.splunkToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ebpf-edr.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "ebpf-edr.name" . }}
    {{- include "ebpf-edr.labels" . | nindent 4 }}
type: Opaque
stringData:
  splunk-token: {{ .Values.secret.splunkToken | quote }}
{{- end }}
