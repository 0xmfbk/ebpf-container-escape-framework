apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebpf-edr.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  config.toml: |
    mode = "{{ .Values.config.mode }}"
    [log]
    level = "info"
    [output]
    format = "{{ .Values.config.output.format }}"
    target = "{{ .Values.config.output.target }}"
    {{- if eq .Values.config.output.target "webhook" }}
    [output.webhook]
    url = "{{ .Values.config.output.webhook_url }}"
    auth_header = "{{ .Values.config.output.webhook_token }}"
    batch_size = 100
    {{- end }}
