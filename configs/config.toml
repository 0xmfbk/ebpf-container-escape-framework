# ebpf-container-escape-framework - Default Configuration
mode = "audit"

# Top level array: Must be before any [sections]
disabled_actions = [
    "Perf_Event_Open",
    "Executable_Memory",
]

[log]
path        = "/var/log/ebpf_edr.json"
max_bytes   = 52428800
max_backups = 5
level       = "info"

[filter]
comm_allowlist = []
cgroup_allowlist = []

[rates]
events_per_sec = 200
burst          = 400

[container]
cache_max_entries = 5000

[context]
lineage_max_depth  = 16
lineage_cache_size = 20000
cgroup_cache_size  = 5000

[output]
format = "json"
target = "file"
path   = "/var/log/ebpf_edr.json"

[output.syslog]
network = "udp"
address = "siem.internal:514"
tag     = "ebpf-edr"

[output.webhook]
url         = ""
auth_header = ""
splunk_hec  = false
batch_size  = 100

# Prometheus /metrics endpoint (counters and gauges only). Off by default;
# binds localhost so enabling it never exposes counters to the network.
[metrics]
enabled = false
bind = "127.0.0.1:9400"

# Synthetic INFO Sensor_Heartbeat alert every health tick (60s) through
# the normal sink, so a SIEM can alert on sensor silence.
[sensor]
heartbeat_event = false

# Ports that raise Network_Connection from INFO to HIGH (live-reloadable).
[network]
suspicious_ports = [4444, 1337, 31337, 6666, 6697]
