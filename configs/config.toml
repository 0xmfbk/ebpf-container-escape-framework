# ebpf-container-escape-framework — Phase 2.4 (audit-only, v3 events)
mode = "audit"

[log]
path        = "/var/log/ebpf_edr.json"
max_bytes   = 52428800
max_backups = 5
level       = "info"

[filter]
comm_allowlist = []
cgroup_allowlist = []

[rates]
events_per_sec = 200
burst          = 400

[container]
cache_max_entries = 5000

[context]
lineage_max_depth  = 16
lineage_cache_size = 20000
cgroup_cache_size  = 5000

# Actions suppressed at the kernel level (never reserve ringbuf space).
# Perf and mprotect are extremely chatty on production systems; keep disabled
# unless actively hunting for perf-based eBPF attachment or W^X bypasses.
disabled_actions = [
    "Perf_Event_Open",
    "Executable_Memory",
]

# ============================================================
# Output (Phase 2.6)
# ============================================================
# format : json | ecs | ocsf | cef | leef
# target : file | stdout | syslog | webhook
# If [output] is absent or omitted, behavior is byte-identical to v1.x.
[output]
format = "json"
target = "file"
path   = "/var/log/ebpf_edr.json"

# Syslog transport (target = "syslog")
[output.syslog]
network = "udp"                 # udp | tcp | tls
address = "siem.internal:514"
tag     = "ebpf-edr"
tls_ca  = ""

# Webhook transport (target = "webhook")
[output.webhook]
url                  = ""       # e.g. https://splunk.internal:8088/services/collector/event
auth_header          = ""       # e.g. Splunk ${SPLUNK_HEC_TOKEN}   (env vars expanded)
batch_style          = "ndjson" # json | ndjson
splunk_hec           = false    # wraps payload for Splunk HEC
insecure_skip_verify = false
batch_size           = 100
flush_interval       = "2s"
timeout              = "5s"
